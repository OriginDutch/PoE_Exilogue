# Builds the Windows installer on GitHub's own Windows machine and publishes it as a GitHub release.
# Exilogue's auto-update reads those releases (Exilogue-Setup-x.y.z.exe, .blockmap, latest.yml).
#
# Stable releases only. Test versions (x.y.z-beta.N) go through release-test.yml.
# Start it by pushing a tag like v0.7.0 (it must match "version" in package.json),
# or by hand: Actions > Release > Run workflow (uses the version in package.json).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload its files

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"
            exit 1
          fi

      - name: Stable versions only (test versions use "Release test")
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) echo "::error::$v is a test version. Run the Release test workflow for it."; exit 1;; esac

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build installer and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

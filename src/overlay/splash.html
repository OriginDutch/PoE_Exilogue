<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Time for a break?</title>
  <link rel="stylesheet" href="../../node_modules/@fontsource/cinzel/600.css">
  <link rel="stylesheet" href="../renderer/ui-kit.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
    body::before, body::after { display: none !important; }
    #b {
      position: fixed; left: 50%; top: 42%;
      transform: translate(-50%, -50%) scale(.92); opacity: 0;
      transition: opacity .2s ease-out, transform .2s ease-out;
      font: 600 54px/1.1 'Cinzel', serif; letter-spacing: .02em; color: var(--tx);
      padding: 22px 40px; border-radius: 16px; white-space: nowrap;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--line2); border-top: 2px solid var(--live, var(--acc));
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .85), 0 0 0 1px rgba(0, 0, 0, .4);
      text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
    }
    #b.in { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #b.go { transition: left .5s cubic-bezier(.5, 0, .3, 1), top .5s cubic-bezier(.5, 0, .3, 1), transform .5s cubic-bezier(.5, 0, .3, 1), opacity .5s ease-in; opacity: .15; }
    #b.out { opacity: 0; transition: opacity .15s linear; }
  </style>
</head>
<body>
  <div id="root"><div id="b" role="alert">Time for a break?</div></div>
  <script src="splash.js"></script>
</body>
</html>
